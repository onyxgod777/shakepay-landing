<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0b0e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6399eb"/>
      <stop offset="100%" style="stop-color:#4a7ed4"/>
    </linearGradient>
    <linearGradient id="btc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" rx="40" fill="url(#bg)"/>
  <!-- Maple leaf outline (Canada) -->
  <path d="M200 40 L210 90 L250 70 L240 100 L280 95 L260 120 L300 130 L270 140 L310 160 L270 165 L290 195 L250 180 L240 210 L230 180 L200 190 L170 180 L160 210 L150 180 L110 195 L130 165 L90 160 L130 140 L100 130 L140 120 L120 95 L160 100 L150 70 L190 90 Z" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>
  <!-- BTC coin -->
  <circle cx="160" cy="180" r="60" fill="url(#btc)" opacity="0.15"/>
  <circle cx="160" cy="180" r="60" fill="none" stroke="rgba(247,147,26,0.2)" stroke-width="1"/>
  <text x="160" y="192" text-anchor="middle" font-size="40" font-weight="bold" fill="#f7931a" filter="url(#glow)">₿</text>
  <!-- ETH diamond -->
  <polygon points="240,130 270,180 240,230 210,180" fill="rgba(99,153,235,0.12)" stroke="rgba(99,153,235,0.2)" stroke-width="1"/>
  <text x="240" y="188" text-anchor="middle" font-size="28" fill="#6399eb">◇</text>
  <!-- $20 badge -->
  <rect x="145" y="280" width="110" height="40" rx="20" fill="url(#gold)" opacity="0.9"/>
  <text x="200" y="307" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">$20 Free</text>
  <!-- Decorative dots -->
  <circle cx="70" cy="70" r="2" fill="rgba(255,255,255,0.05)"/>
  <circle cx="330" cy="50" r="1.5" fill="rgba(255,255,255,0.04)"/>
  <circle cx="350" cy="100" r="2" fill="rgba(255,255,255,0.03)"/>
  <circle cx="50" cy="120" r="1.5" fill="rgba(255,255,255,0.04)"/>
  <circle cx="300" cy="300" r="2" fill="rgba(255,255,255,0.03)"/>
  <circle cx="340" cy="250" r="1.5" fill="rgba(255,255,255,0.04)"/>
  <circle cx="60" cy="310" r="1.5" fill="rgba(255,255,255,0.03)"/>
</svg>
